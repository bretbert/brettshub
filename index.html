<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brett's Hub</title>
<meta name="description" content="Brett's personal and work organizer.">
<meta name="theme-color" content="#0a121c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e9eff4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brett's Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a console-style app shell. Sticky top bar holds the Personal/Work switch; one working view at a time;
   bottom bar on phones, left rail on desktop; guided flows take over the full screen one step at a time. Dark-first. */
:root{
  color-scheme: dark;
  --bg:#0a121c; --dots:rgba(150,180,205,.075);
  --panel:#0f1a27; --panel-2:#13202f; --raise:#1b2c40;
  --line:#22374c; --line-2:#32506c;
  --text:#e3ecf3; --muted:#91a5b7; --faint:#62778a;
  --cyan:#5cc8d6; --amber:#e8a940;
  --ok:#5fd39a; --warn:#f2894b; --danger:#f26d6d;
  --on-acc:#071420; --scrim:rgba(3,8,14,.62);
  --shadow:0 18px 40px rgba(0,0,0,.45);
  --f-display:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --acc:var(--cyan);
  --acc-soft:color-mix(in srgb,var(--acc) 15%,transparent);
  --acc-line:color-mix(in srgb,var(--acc) 55%,var(--line));
  --ok-soft:color-mix(in srgb,var(--ok) 15%,transparent);
  --warn-soft:color-mix(in srgb,var(--warn) 16%,transparent);
  --danger-soft:color-mix(in srgb,var(--danger) 16%,transparent);
  --rail:208px; --nav-h:64px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#e9eff4; --dots:rgba(20,50,80,.075);
    --panel:#ffffff; --panel-2:#f3f7fa; --raise:#e4ecf2;
    --line:#d0dbe5; --line-2:#b0c2d2;
    --text:#0f1c28; --muted:#506375; --faint:#7d8fa0;
    --cyan:#08808f; --amber:#9d6208;
    --ok:#15824c; --warn:#bf5517; --danger:#c23a3a;
    --on-acc:#ffffff; --scrim:rgba(15,28,40,.38);
    --shadow:0 18px 40px rgba(20,40,60,.18);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#e9eff4; --dots:rgba(20,50,80,.075);
  --panel:#ffffff; --panel-2:#f3f7fa; --raise:#e4ecf2;
  --line:#d0dbe5; --line-2:#b0c2d2;
  --text:#0f1c28; --muted:#506375; --faint:#7d8fa0;
  --cyan:#08808f; --amber:#9d6208;
  --ok:#15824c; --warn:#bf5517; --danger:#c23a3a;
  --on-acc:#ffffff; --scrim:rgba(15,28,40,.38);
  --shadow:0 18px 40px rgba(20,40,60,.18);
}
:root[data-side="work"]{ --acc:var(--amber); }

*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none!important; }
html,body{ min-height:100%; }
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dots) 1px,transparent 1.3px);
  background-size:22px 22px;
  color:var(--text); font:15px/1.45 var(--f-body);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--bg); }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:0; padding:0; text-align:inherit; }
:focus-visible{ outline:2px solid var(--acc); outline-offset:2px; }
h1,h2,h3{ font-family:var(--f-display); font-weight:600; margin:0; text-wrap:balance; letter-spacing:.01em; }
h1{ font-size:26px; line-height:1.15; }
h2{ font-size:18px; }
h3{ font-size:15px; }
p{ margin:0; }
.ic{ width:20px; height:20px; flex:none; }
.muted{ color:var(--muted); }
.eyebrow{ font:500 11.5px/1 var(--f-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.num{ font-family:var(--f-display); font-variant-numeric:tabular-nums; }

/* ---------- shell */
.app{ min-height:100%; }
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand-mark{ width:30px; height:30px; flex:none; color:var(--acc); }
.brand-name{ font:600 17px/1 var(--f-display); letter-spacing:.03em; white-space:nowrap; }
.top-r{ display:flex; align-items:center; gap:10px; }
.sync{ width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
.sync.on{ background:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }
.sync.local{ background:var(--warn); }
.switch{ display:flex; padding:3px; gap:3px; background:var(--panel); border:1px solid var(--line); border-radius:9px; }
.switch button{ display:flex; align-items:center; gap:7px; min-height:40px; padding:0 14px; border-radius:6px; font:600 14px var(--f-display); letter-spacing:.03em; color:var(--muted); }
.switch button[aria-pressed="true"]{ background:var(--acc); color:var(--on-acc); }
.switch .ic{ width:18px; height:18px; }

.view{
  width:100%; max-width:880px; margin:0 auto;
  padding-block:18px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:18px;
}
.banner{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line)); background:var(--warn-soft); border-radius:8px; font-size:14px; }
.banner .ic{ color:var(--warn); margin-top:1px; }

.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:35;
  display:grid; grid-template-columns:repeat(6,minmax(0,1fr));
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px)); padding-right:max(8px,env(safe-area-inset-right,0px));
  background:var(--panel); border-top:1px solid var(--line);
}
.nav button{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; height:var(--nav-h); color:var(--muted); font:600 11px var(--f-display); letter-spacing:.02em; }
.nav button .ic{ width:22px; height:22px; }
.nav button[aria-current="page"]{ color:var(--acc); }
.nav button[aria-current="page"]::before{ content:""; position:absolute; top:0; left:28%; right:28%; height:3px; background:var(--acc); }
.nav .rail-brand{ display:none; }

.fab{
  position:fixed; z-index:36;
  right:calc(max(16px,env(safe-area-inset-right,0px)) + 2px);
  bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));
  width:60px; height:60px; display:grid; place-items:center;
  background:var(--acc); color:var(--on-acc);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.fab .ic{ width:28px; height:28px; stroke-width:2.4; }

@media (min-width:900px){
  .app{ padding-left:var(--rail); }
  .nav{
    top:0; right:auto; width:var(--rail); height:100%;
    display:flex; flex-direction:column; gap:4px; padding:calc(14px + env(safe-area-inset-top,0px)) 12px 20px max(12px,env(safe-area-inset-left,0px));
    border-top:0; border-right:1px solid var(--line);
  }
  .nav .rail-brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 18px; }
  .nav button{ flex-direction:row; justify-content:flex-start; gap:12px; height:46px; padding:0 12px; border-radius:7px; font-size:14.5px; }
  .nav button[aria-current="page"]{ background:var(--acc-soft); }
  .nav button[aria-current="page"]::before{ top:10px; bottom:10px; left:0; right:auto; width:3px; height:auto; }
  .top .brand{ visibility:hidden; }
  .view{ padding-block:24px 110px; gap:22px; }
  .fab{ bottom:28px; right:32px; }
}

/* ---------- buttons, chips, tags */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:0 18px; border:1px solid var(--line-2); border-radius:7px;
  background:var(--panel-2); color:var(--text);
  font:600 15px var(--f-display); letter-spacing:.03em; white-space:nowrap;
}
.btn:hover{ border-color:var(--acc-line); }
a.btn{ text-decoration:none; }
.btn.primary{ background:var(--acc); color:var(--on-acc); border:0; border-radius:0; clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px); }
.btn.sm{ min-height:40px; padding:0 14px; font-size:14px; }
.btn.xs{ min-height:34px; padding:0 11px; font-size:13px; border-radius:6px; }
.btn.block{ width:100%; }
.btn.ghost{ background:transparent; }
.btn.danger{ color:var(--danger); border-color:color-mix(in srgb,var(--danger) 45%,var(--line)); }
.btn.ok{ color:var(--ok); border-color:color-mix(in srgb,var(--ok) 45%,var(--line)); }
.btn[disabled]{ opacity:.5; cursor:default; }
.btn .ic{ width:18px; height:18px; }
.icon-btn{ width:44px; height:44px; display:grid; place-items:center; border-radius:8px; color:var(--muted); }
.icon-btn:hover{ background:var(--panel-2); color:var(--text); }
.btn-row{ display:flex; flex-wrap:wrap; gap:8px; }

.seg{ display:flex; gap:3px; padding:3px; background:var(--panel); border:1px solid var(--line); border-radius:9px; }
.seg button{ flex:1 1 0; min-width:0; min-height:40px; padding:0 8px; border-radius:6px; font:600 13.5px var(--f-display); letter-spacing:.03em; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg button[aria-pressed="true"]{ background:var(--acc-soft); color:var(--text); box-shadow:inset 0 0 0 1px var(--acc-line); }
.seg .ct{ font-variant-numeric:tabular-nums; color:var(--muted); margin-left:4px; }

.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ min-height:44px; padding:0 16px; border:1px solid var(--line-2); border-radius:7px; background:var(--panel-2); font:600 14px var(--f-display); letter-spacing:.02em; display:inline-flex; align-items:center; gap:8px; }
.chip small{ font:400 12.5px var(--f-body); color:var(--muted); letter-spacing:0; }
.chip[aria-pressed="true"]{ background:var(--acc); color:var(--on-acc); border-color:transparent; }
.chip[aria-pressed="true"] small{ color:inherit; opacity:.8; }
.chip .ic{ width:17px; height:17px; }

.tag{ display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:5px; font:600 12px/1.25 var(--f-display); letter-spacing:.03em; white-space:nowrap; background:var(--raise); color:var(--muted); }
.tag.acc{ background:var(--acc-soft); color:var(--acc); }
.tag.ok{ background:var(--ok-soft); color:var(--ok); }
.tag.warn{ background:var(--warn-soft); color:var(--warn); }
.tag.danger{ background:var(--danger-soft); color:var(--danger); }
.tag.side-personal{ background:color-mix(in srgb,var(--cyan) 15%,transparent); color:var(--cyan); }
.tag.side-work{ background:color-mix(in srgb,var(--amber) 16%,transparent); color:var(--amber); }

/* ---------- today */
.hello{ display:flex; flex-direction:column; gap:6px; }
.hero{
  position:relative; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px;
  width:100%; padding:16px; background:var(--panel); border:1px solid var(--acc-line); border-radius:10px;
}
.hero:hover{ background:var(--panel-2); }
.hero-icon{ width:52px; height:52px; display:grid; place-items:center; background:var(--acc); color:var(--on-acc); clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
.hero-icon .ic{ width:24px; height:24px; }
.hero-title{ font:600 19px/1.2 var(--f-display); letter-spacing:.02em; }
.hero-sub{ color:var(--muted); font-size:13.5px; margin-top:2px; }
.hero > .ic{ color:var(--muted); }
.hero.done{ border-color:var(--line); }
.hero.done .hero-icon{ background:var(--ok-soft); color:var(--ok); }

.tiles{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
@media (min-width:640px){ .tiles{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
.tile{
  position:relative; display:flex; flex-direction:column; gap:4px; min-height:92px; padding:12px 13px;
  background:var(--panel); border:1px solid var(--line); border-radius:9px; overflow:hidden;
}
.tile:hover{ border-color:var(--acc-line); }
.tile::after{ content:""; position:absolute; top:0; right:0; width:16px; height:16px; background:var(--tile-c,var(--line-2)); clip-path:polygon(0 0,100% 0,100% 100%); }
.tile.s-danger{ --tile-c:var(--danger); } .tile.s-warn{ --tile-c:var(--warn); } .tile.s-ok{ --tile-c:var(--ok); } .tile.s-acc{ --tile-c:var(--acc); }
.tile-top{ display:flex; align-items:center; gap:8px; color:var(--muted); font:600 13px var(--f-display); letter-spacing:.03em; }
.tile-top .ic{ width:17px; height:17px; }
.tile .num{ font-size:32px; line-height:1.05; font-weight:600; margin-top:auto; }
.tile .num.small{ font-size:22px; }
.tile-sub{ font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile-sub.danger{ color:var(--danger); } .tile-sub.warn{ color:var(--warn); }

.panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:12px; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.habit-strip{ display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:6px; }
@media (max-width:430px){ .top .brand-name{ display:none; } }
.hbtn{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px 8px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); font:600 12px/1.15 var(--f-display); letter-spacing:.02em; color:var(--muted); text-align:center; }
.hbtn .ic{ width:24px; height:24px; }
.hbtn[aria-pressed="true"]{ background:var(--acc-soft); border-color:var(--acc-line); color:var(--text); }
.hbtn[aria-pressed="true"] .ic{ color:var(--acc); }
.court-list{ display:flex; flex-direction:column; gap:8px; }

/* ---------- rows / lists */
.list{ display:flex; flex-direction:column; gap:8px; }
.row{ display:flex; align-items:center; gap:12px; padding:10px 12px; min-height:58px; background:var(--panel); border:1px solid var(--line); border-radius:9px; }
.row-main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; padding:4px 0; }
.row-title{ font-weight:500; overflow-wrap:anywhere; }
.row-meta{ display:flex; flex-wrap:wrap; gap:6px; font-size:12.5px; color:var(--muted); }
.row-meta:empty{ display:none; }
.row.done .row-title{ color:var(--muted); text-decoration:line-through; }
.check{ width:30px; height:30px; flex:none; border-radius:50%; border:2px solid var(--line-2); display:grid; place-items:center; color:transparent; }
.check:hover{ border-color:var(--acc); }
.check .ic{ width:16px; height:16px; stroke-width:3; }
.check.on{ background:var(--ok); border-color:var(--ok); color:var(--on-acc); }
.row-actions{ display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }

.card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:10px; }
button.card{ width:100%; }
button.card:hover{ border-color:var(--acc-line); }
.card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.card-title{ font:600 16.5px/1.25 var(--f-display); letter-spacing:.02em; overflow-wrap:anywhere; }
.card-sub{ font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
.bar{ height:6px; border-radius:3px; background:var(--raise); overflow:hidden; }
.bar > i{ display:block; height:100%; background:var(--acc); border-radius:3px; }
.bar.ok > i{ background:var(--ok); } .bar.warn > i{ background:var(--warn); } .bar.danger > i{ background:var(--danger); width:100%!important; }
.grid2{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:10px; }

.head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.head-l{ display:flex; align-items:center; gap:8px; min-width:0; }
.empty{ display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; padding:26px 16px; border:1px dashed var(--line-2); border-radius:10px; color:var(--muted); }
.empty .ic{ width:30px; height:30px; color:var(--acc); }
.empty b{ color:var(--text); font:600 16px var(--f-display); letter-spacing:.02em; }
.qa{ display:flex; gap:8px; }
.qa input{ flex:1 1 auto; min-width:0; }

/* ---------- forms */
.field{ display:flex; flex-direction:column; gap:8px; }
.field > label, .label{ font:600 13px var(--f-display); letter-spacing:.05em; color:var(--muted); text-transform:uppercase; }
.in{ width:100%; min-height:48px; padding:10px 12px; border:1px solid var(--line-2); border-radius:7px; background:var(--panel-2); font-size:16px; }
.in:focus{ outline:none; border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); }
textarea.in{ min-height:96px; resize:vertical; line-height:1.4; }
select.in{ appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%; background-size:6px 6px; background-repeat:no-repeat; padding-right:34px; }
.in-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
.hint{ font-size:13px; color:var(--muted); }

/* ---------- calendar */
.cal-head{ display:flex; align-items:center; gap:6px; }
.cal-head h2{ flex:1; font-size:20px; }
.cal{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
.cal .dow{ text-align:center; font:500 11px var(--f-mono); letter-spacing:.12em; color:var(--muted); padding:4px 0; }
.day{ display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; height:52px; padding-top:7px; border-radius:7px; background:var(--panel); border:1px solid var(--line); font:600 14px var(--f-display); font-variant-numeric:tabular-nums; }
.day.out{ background:transparent; border-color:transparent; color:var(--faint); }
.day.today{ border-color:var(--acc); color:var(--acc); }
.day[aria-pressed="true"]{ background:var(--acc); color:var(--on-acc); border-color:var(--acc); }
.dots{ display:flex; gap:3px; height:6px; }
.dots i{ width:6px; height:6px; border-radius:50%; background:var(--acc); }
.dots i.t{ background:var(--muted); } .dots i.c{ background:var(--danger); }
.day[aria-pressed="true"] .dots i{ background:var(--on-acc); }
@media (min-width:640px){ .day{ height:64px; } }

/* ---------- habits */
.habit-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
@media (min-width:640px){ .habit-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
.habit{ display:flex; align-items:center; gap:12px; min-height:76px; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); }
.habit .hi{ width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:9px; background:var(--panel-2); color:var(--muted); }
.habit .hi .ic{ width:24px; height:24px; }
.habit-name{ font:600 15px/1.2 var(--f-display); letter-spacing:.02em; }
.habit-streak{ font-size:12.5px; color:var(--muted); }
.habit[aria-pressed="true"]{ border-color:var(--acc-line); background:var(--acc-soft); }
.habit[aria-pressed="true"] .hi{ background:var(--acc); color:var(--on-acc); }
.week{ width:100%; border-collapse:collapse; }
.week th{ font:500 11px var(--f-mono); letter-spacing:.1em; color:var(--muted); padding:4px 0; }
.week td{ text-align:center; padding:5px 0; }
.week td:first-child{ text-align:left; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; padding-right:8px; }
.pip{ display:inline-block; width:14px; height:14px; border-radius:4px; border:1.5px solid var(--line-2); vertical-align:middle; }
.pip.on{ background:var(--acc); border-color:var(--acc); }

/* ---------- more */
.big-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
@media (min-width:640px){ .big-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
.big{ display:flex; flex-direction:column; align-items:flex-start; gap:10px; min-height:112px; padding:14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); }
.big:hover{ border-color:var(--acc-line); }
.big .bi{ width:40px; height:40px; display:grid; place-items:center; border-radius:8px; background:var(--acc-soft); color:var(--acc); }
.big b{ font:600 15.5px/1.2 var(--f-display); letter-spacing:.02em; }
.big span{ font-size:12.5px; color:var(--muted); }

/* ---------- sheet */
.overlay{ position:fixed; inset:0; z-index:70; display:flex; align-items:flex-end; justify-content:center; }
.scrim{ position:absolute; inset:0; background:var(--scrim); }
.sheet{
  position:relative; width:100%; max-width:600px; max-height:min(92vh,92dvh);
  display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--line);
  border-radius:14px 14px 0 0; box-shadow:var(--shadow);
}
.sheet-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 8px 8px max(18px,env(safe-area-inset-left,0px)); border-bottom:1px solid var(--line); }
.sheet-head h2{ font-size:19px; }
.sheet-body{ overflow-y:auto; overscroll-behavior:contain; padding:16px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:18px; }
.sheet-foot{ display:flex; gap:10px; align-items:center; padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px)); border-top:1px solid var(--line); }
.sheet-foot .grow{ flex:1; }
@media (min-width:700px){ .overlay{ align-items:center; } .sheet{ border-radius:12px; max-height:86vh; } }

/* ---------- guided flow */
.flow{ position:fixed; inset:0; z-index:65; display:flex; flex-direction:column; background-color:var(--bg); background-image:radial-gradient(var(--dots) 1px,transparent 1.3px); background-size:22px 22px; }
.flow-top{ display:flex; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px)); }
.flow-name{ flex:1; font:600 14px var(--f-display); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.flow-count{ font:500 12px var(--f-mono); letter-spacing:.1em; color:var(--muted); padding-right:6px; }
.flow-prog{ display:flex; gap:4px; padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px)); }
.flow-prog i{ flex:1; height:4px; border-radius:2px; background:var(--line); }
.flow-prog i.on{ background:var(--acc); }
.flow-body{ flex:1; overflow-y:auto; overscroll-behavior:contain; }
.flow-inner{ width:100%; max-width:640px; margin:0 auto; padding-block:22px 28px; padding-left:max(18px,env(safe-area-inset-left,0px)); padding-right:max(18px,env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:16px; }
.flow-inner h1{ font-size:28px; }
.lede{ color:var(--muted); font-size:15.5px; }
.flow-foot{ display:flex; gap:10px; width:100%; max-width:640px; margin:0 auto; padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px)); }
.flow-foot .btn{ min-height:54px; }
.flow-foot .btn.primary{ flex:1; font-size:16px; }
.resolved{ font:600 13px var(--f-display); letter-spacing:.03em; color:var(--ok); display:inline-flex; align-items:center; gap:6px; }
.resolved .ic{ width:16px; height:16px; }
.step-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
.step-card.is-done{ opacity:.7; }
.day-block{ display:flex; flex-direction:column; gap:6px; }
.day-label{ font:600 13px var(--f-display); letter-spacing:.05em; color:var(--muted); text-transform:uppercase; padding-top:6px; }
.mini{ display:flex; align-items:center; gap:8px; font-size:14px; padding:6px 0; border-bottom:1px solid var(--line); }
.mini:last-child{ border-bottom:0; }
.mini .t{ color:var(--muted); font:500 12.5px var(--f-mono); min-width:64px; }
.done-mark{ width:84px; height:84px; display:grid; place-items:center; background:var(--acc); color:var(--on-acc); clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px); }
.done-mark .ic{ width:40px; height:40px; stroke-width:2.6; }
.thinking{ display:flex; align-items:center; gap:10px; color:var(--muted); }
.thinking i{ width:8px; height:8px; border-radius:50%; background:var(--acc); animation:pulse 1s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ opacity:.25 } 50%{ opacity:1 } }

.toast{ position:fixed; z-index:90; left:50%; transform:translateX(-50%); bottom:calc(var(--nav-h) + 92px + env(safe-area-inset-bottom,0px)); max-width:calc(100% - 32px); display:flex; align-items:center; gap:12px; padding:12px 14px 12px 16px; background:var(--text); color:var(--bg); border-radius:9px; box-shadow:var(--shadow); font-weight:500; font-size:14.5px; }
.toast button{ font:600 14px var(--f-display); letter-spacing:.04em; color:var(--bg); text-decoration:underline; text-underline-offset:3px; }
@media (min-width:900px){ .toast{ bottom:32px; left:calc(50% + var(--rail) / 2); } }

.loading{ display:flex; align-items:center; gap:10px; color:var(--muted); padding:30px 4px; }
/* ---------- skills */
.char{ display:flex; gap:14px; align-items:center; padding:14px; background:var(--panel); border:1px solid var(--acc-line); border-radius:10px; }
.char-lvl{ width:72px; height:72px; flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:var(--acc); color:var(--on-acc); clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px); }
.char-lvl .eyebrow{ color:inherit; opacity:.75; font-size:10px; }
.char-lvl b{ font-size:30px; line-height:1; font-weight:700; }
.char-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
.char-row{ display:flex; justify-content:space-between; align-items:baseline; gap:4px 10px; flex-wrap:wrap; font:600 15px var(--f-display); letter-spacing:.02em; }
.char-row .muted{ font:400 12.5px var(--f-body); }
.char-stats{ display:flex; flex-wrap:wrap; gap:2px 14px; font-size:12.5px; color:var(--muted); }
.char-stats b{ color:var(--text); font-family:var(--f-display); font-weight:600; }
.tree-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.tree-tile{ display:flex; flex-direction:column; gap:6px; min-height:98px; padding:11px 10px 10px; background:var(--panel); border:1px solid var(--line); border-radius:9px; }
.tree-tile:hover{ border-color:var(--acc-line); }
.tree-tile .ic{ width:20px; height:20px; color:var(--acc); }
.tree-tile b{ font:600 13px/1.15 var(--f-display); letter-spacing:.02em; overflow-wrap:anywhere; }
.tree-tile .tt-ct{ margin-top:auto; font:500 11.5px var(--f-mono); color:var(--muted); }
.tree-tile .bar{ height:4px; }
.tree-tile:last-child:nth-child(3n+1){ grid-column:1 / -1; min-height:0; display:grid; grid-template-columns:auto 1fr auto; align-items:center; column-gap:10px; }
.tree-tile:last-child:nth-child(3n+1) .bar{ grid-column:1 / -1; }
@media (min-width:640px){ .tree-grid{ gap:10px; } .tree-tile{ min-height:106px; padding:14px; } .tree-tile b{ font-size:15px; } }

.tree{ position:relative; width:100%; margin-top:-4px; }
.tree > svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.tree line{ stroke:var(--line-2); stroke-width:2; }
.tree line.open{ stroke:var(--acc); stroke-opacity:.55; stroke-dasharray:5 5; }
.tree line.on{ stroke:var(--acc); }
.node{ --clip:inset(0 round 11px); --ring:var(--line-2); --fill:var(--panel); --glyph:var(--muted);
  position:absolute; width:20%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:5px; padding-top:8px; text-align:center; }
.node .shape{ width:44px; height:44px; flex:none; display:grid; place-items:center; background:var(--ring); clip-path:var(--clip); }
.node .shape > span{ width:calc(100% - 4px); height:calc(100% - 4px); display:grid; place-items:center; background:var(--fill); color:var(--glyph); clip-path:var(--clip); }
.node .shape .ic{ width:19px; height:19px; }
.node .nlabel{ max-width:100%; padding:0 1px; font:600 11px/1.18 var(--f-display); letter-spacing:.01em; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:break-word; -webkit-hyphens:auto; hyphens:auto; }
@media (max-width:389px){ .node .nlabel{ font-size:10.5px; letter-spacing:0; } }
.node.t-start{ --clip:circle(50%); }
.node.t-cert{ --clip:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%); }
.node.t-cert .shape{ width:48px; }
.node.t-goal{ --clip:polygon(50% 0,63% 33%,99% 36%,71% 59%,80% 96%,50% 76%,20% 96%,29% 59%,1% 36%,37% 33%); }
.node.t-goal .shape{ width:50px; height:48px; margin-top:-2px; }
.node.t-goal .shape > span{ width:calc(100% - 6px); height:calc(100% - 6px); padding-top:4px; }
.node.t-goal .ic{ width:14px; height:14px; }
.node.s-earned{ --ring:var(--acc); --fill:var(--acc); --glyph:var(--on-acc); }
.node.s-open{ --ring:var(--acc); --glyph:var(--acc); }
.node.s-locked{ --ring:var(--line); --glyph:var(--faint); }
.node.s-expired{ --ring:var(--warn); --fill:var(--panel); --glyph:var(--warn); }
.node.s-locked .nlabel{ color:var(--muted); font-weight:500; }
.node:hover .shape, .node:focus-visible .shape{ filter:brightness(1.15); }
.rk{ display:flex; gap:3px; align-items:flex-end; height:16px; }
.rk i{ width:5px; border-radius:2px; background:currentColor; opacity:.28; }
.rk i:nth-child(1){ height:8px; } .rk i:nth-child(2){ height:12px; } .rk i:nth-child(3){ height:16px; }
.rk i.on{ opacity:1; }
@media (min-width:640px){ .node .shape{ width:50px; height:50px; } .node.t-cert .shape{ width:54px; } .node.t-goal .shape{ width:56px; height:54px; } .node .nlabel{ font-size:12.5px; } }
.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); }
.legend span{ display:inline-flex; align-items:center; gap:6px; }
.lg{ width:12px; height:12px; background:var(--line-2); display:inline-block; }
.lg.sq{ border-radius:3px; } .lg.hex{ clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%); }
.lg.st{ clip-path:polygon(50% 0,63% 33%,99% 36%,71% 59%,80% 96%,50% 76%,20% 96%,29% 59%,1% 36%,37% 33%); }
.lg.on{ background:var(--acc); border-radius:3px; } .lg.op{ background:transparent; box-shadow:inset 0 0 0 2px var(--acc); border-radius:3px; }
.xp{ font:500 12px var(--f-mono); color:var(--acc); }
.li-names{ display:flex; gap:6px; align-items:flex-start; }
.li-names .ic{ width:14px; height:14px; flex:none; margin-top:2px; }
.goal-row .row-main{ gap:5px; }
.goal-row .bar{ height:4px; margin-top:2px; }
.goal-row .hi{ color:var(--acc); }
.focus-bar{ display:flex; gap:12px; align-items:flex-start; padding:12px 14px; background:var(--acc-soft); border:1px solid var(--acc-line); border-radius:10px; }
.focus-bar .fb-ic .ic{ width:22px; height:22px; color:var(--acc); margin-top:2px; }
.focus-bar .grow{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.focus-bar b{ font:600 15px var(--f-display); letter-spacing:.02em; }
.focus-bar .chips{ margin-top:4px; }
.fb-btns{ display:flex; gap:6px; align-items:center; flex:none; }
.node.dim{ opacity:.18; }
.tree line.dim{ opacity:.15; }
.node.pinned .shape{ filter:drop-shadow(0 0 6px var(--acc)); }
.jobs-label{ position:absolute; left:0; right:0; height:1px; border-top:1px dashed var(--line-2); }
.jobs-label span{ position:absolute; left:50%; transform:translate(-50%,-55%); padding:0 10px; background:var(--bg); font:600 11px var(--f-display); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
.step-row .icon-btn.sm{ width:32px; height:32px; opacity:.55; }
.step-row .icon-btn.sm .ic{ width:15px; height:15px; }
.facts{ gap:14px; }
.facts h3{ font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.facts ul{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:14px; }
.facts ul.have{ list-style:none; padding-left:0; }
.facts ul.have li{ display:flex; gap:8px; align-items:flex-start; }
.facts ul.have .ic{ width:16px; height:16px; color:var(--ok); margin-top:2px; flex:none; }
.facts .btn{ align-self:flex-start; }
.row-meta .tag{ cursor:pointer; }
.row-meta .tag .ic{ width:13px; height:13px; }

/* ---------- training */
.tiles.tiles3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.tiles3 .tile{ min-height:86px; padding:11px 11px; }
.tiles3 .tile .num{ font-size:26px; }
.tiles3 .tile-top{ font-size:12px; }
.tr-row{ text-align:left; width:100%; }
.tr-date{ width:38px; flex:none; display:flex; flex-direction:column; align-items:center; gap:3px; line-height:1; }
.tr-date b{ font:600 19px var(--f-display); font-variant-numeric:tabular-nums; }
.tr-date small{ font:500 10px var(--f-mono); letter-spacing:.1em; color:var(--muted); }
.tag .ic{ width:13px; height:13px; }
.toggle{ display:flex; align-items:center; gap:14px; width:100%; min-height:64px; padding:12px 16px; border:1px solid var(--line-2); border-radius:10px; background:var(--panel); font:600 16px var(--f-display); letter-spacing:.02em; text-align:left; }
.toggle .box{ width:28px; height:28px; flex:none; border-radius:6px; border:2px solid var(--line-2); display:grid; place-items:center; color:transparent; }
.toggle .box .ic{ width:18px; height:18px; stroke-width:3; }
.toggle[aria-pressed="true"]{ border-color:var(--acc-line); background:var(--acc-soft); border-radius:10px 10px 0 0; }
.toggle[aria-pressed="true"] .box{ background:var(--acc); border-color:var(--acc); color:var(--on-acc); }
.reveal{ display:flex; flex-direction:column; gap:16px; margin-top:-16px; padding:16px; background:var(--panel); border:1px solid var(--acc-line); border-top:0; border-radius:0 0 10px 10px; }
.file-pick{ display:flex; align-items:center; gap:12px; min-height:64px; padding:12px 14px; border:1px dashed var(--line-2); border-radius:9px; background:var(--panel-2); cursor:pointer; overflow-wrap:anywhere; }
.file-pick > .ic{ width:24px; height:24px; color:var(--acc); }
.file-pick .grow{ flex:1; min-width:0; }
.kvs{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:9px; background:var(--panel); }
.kv{ display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; }
.kv:last-child{ border-bottom:0; }
.kv span{ color:var(--muted); flex:none; }
.kv b{ font-weight:500; text-align:right; overflow-wrap:anywhere; min-width:0; }
.kvs:empty{ display:none; }
.viewer img{ width:100%; height:auto; border-radius:8px; display:block; }
.viewer iframe{ width:100%; height:62vh; border:0; border-radius:8px; background:#fff; }
.olist{ margin:0; padding-left:22px; display:flex; flex-direction:column; gap:12px; }
.olist li{ padding-left:4px; }
.olist li::marker{ font:600 15px var(--f-display); color:var(--acc); }
details summary{ cursor:pointer; }
.in.mono{ font:13px/1.4 var(--f-mono); margin-top:8px; }
.row .hi{ display:grid; place-items:center; }
/* ================= skins ================= */
/* Professional: Monarch-style. Warm linen canvas, white cards, ember orange, pill buttons. Follows the phone's dark mode. */
:root[data-skin="pro"]{
  color-scheme: light;
  --bg:#f3f1ee; --dots:transparent;
  --panel:#ffffff; --panel-2:#f9f8f6; --raise:#efecea;
  --line:#e6e3df; --line-2:#d6d2cd;
  --text:#22201d; --muted:#6f6c68; --faint:#9c9893;
  --cyan:#3a6fd8; --amber:#ff692d;
  --ok:#1f8a5b; --warn:#c96a12; --danger:#d4383e;
  --on-acc:#ffffff; --scrim:rgba(34,32,29,.32);
  --shadow:0 10px 15px -3px rgba(34,32,29,.1),0 4px 6px -4px rgba(34,32,29,.1);
  --f-display:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"Inter","Segoe UI",system-ui,sans-serif;
  --f-serif:"Fraunces",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root[data-skin="pro"]:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#141312; --panel:#1d1c1a; --panel-2:#232220; --raise:#2c2a27;
    --line:#302e2b; --line-2:#45423e;
    --text:#f3f0ec; --muted:#a7a29c; --faint:#75706a;
    --cyan:#4f7fe0; --amber:#ff6a2b;
    --ok:#4cc38a; --warn:#f09a4a; --danger:#f06a6e;
    --scrim:rgba(0,0,0,.55); --shadow:0 18px 40px rgba(0,0,0,.45);
  }
}
[data-skin="pro"] :is(body,.flow){ background-image:none; }
[data-skin="pro"] :is(h1,h2,h3){ letter-spacing:-.012em; font-weight:600; }
[data-skin="pro"] h1{ font:500 29px/1.15 var(--f-serif); letter-spacing:-.035em; }
[data-skin="pro"] .flow-inner h1{ font-size:30px; }
[data-skin="pro"] :is(.btn,.chip,.seg button,.switch button,.nav button,.tag,.brand-name,.tree-tile b,.char-row,.toggle,.focus-bar b,.hero-title,.card-title,.habit-name,.big b,.tile-top,.hbtn,.empty b,.flow-name,.resolved,.toast button){ letter-spacing:-.01em; }
[data-skin="pro"] :is(.field > label,.label,.day-label,.flow-name){ text-transform:none; letter-spacing:-.005em; font:600 13.5px var(--f-body); color:var(--text); }
[data-skin="pro"] .day-label{ color:var(--muted); }
[data-skin="pro"] .eyebrow{ font:600 11px/1 var(--f-body); letter-spacing:.07em; }
[data-skin="pro"] :is(.btn.primary,.fab,.hero-icon,.done-mark,.char-lvl){ clip-path:none; }
[data-skin="pro"] .btn{ border-radius:999px; font-weight:500; }
[data-skin="pro"] .btn:not(.primary){ border:1.5px solid var(--line-2); background:var(--panel); }
[data-skin="pro"] .btn.primary{ border:0; border-radius:999px; box-shadow:0 1px 2px rgba(34,32,29,.08); font-weight:600; }
[data-skin="pro"] .btn.ghost{ background:transparent; border-color:transparent; }
[data-skin="pro"] .btn.ghost:hover{ background:var(--raise); }
[data-skin="pro"] :is(.btn.xs,.btn.sm,.icon-btn,.chip,.tag){ border-radius:999px; }
[data-skin="pro"] .chip{ font-weight:500; }
[data-skin="pro"] .chip:not([aria-pressed="true"]){ border:1.5px solid var(--line-2); background:var(--panel); }
[data-skin="pro"] .tag{ font-weight:500; padding:3px 9px; }
[data-skin="pro"] :is(.switch,.seg){ background:var(--raise); border:0; border-radius:999px; }
[data-skin="pro"] :is(.switch button,.seg button){ border-radius:999px; font-weight:500; }
[data-skin="pro"] :is(.switch button,.seg button)[aria-pressed="true"]{ background:var(--panel); color:var(--text); box-shadow:0 1px 3px rgba(34,32,29,.14); }
[data-skin="pro"] .switch button[aria-pressed="true"] .ic{ color:var(--acc); }
[data-skin="pro"] :is(.panel,.card,.row,.tile,.big,.tree-tile,.char,.hero,.habit,.kvs,.step-card,.toggle,.focus-bar,.empty){ border-radius:12px; }
[data-skin="pro"] :is(.panel,.card,.row,.tile,.big,.tree-tile,.char,.hero,.habit,.kvs,.step-card){ box-shadow:0 1px 2px rgba(34,32,29,.05); }
[data-skin="pro"] :is(.hero,.char){ border-color:var(--line); }
[data-skin="pro"] :is(.hero-icon,.char-lvl){ border-radius:12px; }
[data-skin="pro"] .done-mark{ border-radius:50%; }
[data-skin="pro"] .tile::after{ display:none; }
[data-skin="pro"] .big .bi{ border-radius:10px; }
[data-skin="pro"] .in{ border-radius:8px; border:1px solid var(--line-2); background:var(--panel); }
[data-skin="pro"] .day{ border-radius:10px; }
[data-skin="pro"] .bar, [data-skin="pro"] .bar > i{ border-radius:999px; }

/* Galaxy (Stellaris style): starfield, glassy teal panels with cut corners and glow, gold on the work side. */
:root[data-skin="galaxy"]{
  color-scheme: dark;
  --bg:#03080d; --dots:transparent;
  --panel:#08171c; --panel-2:#0d2127; --raise:#132f37;
  --line:#1b3a40; --line-2:#2c5c61;
  --text:#dcefeb; --muted:#8fb2ac; --faint:#5a7c77;
  --cyan:#3fdcbf; --amber:#e9bd4f;
  --ok:#59d98e; --warn:#f0a548; --danger:#ff6b6b;
  --on-acc:#02110e; --scrim:rgba(0,4,8,.72); --shadow:0 20px 50px rgba(0,0,0,.65);
  --f-display:"Oxanium","Exo 2","Segoe UI",system-ui,sans-serif;
  --f-body:"Exo 2","Segoe UI",system-ui,sans-serif;
  --f-mono:"Oxanium","Segoe UI",system-ui,sans-serif;
  --cut:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
}
[data-skin="galaxy"] :is(body,.flow){
  background-image:
    radial-gradient(1px 1px at 23px 41px,rgba(255,255,255,.85),transparent),
    radial-gradient(1px 1px at 141px 97px,rgba(200,240,255,.7),transparent),
    radial-gradient(1.5px 1.5px at 87px 163px,rgba(255,255,255,.9),transparent),
    radial-gradient(1px 1px at 201px 12px,rgba(255,240,200,.6),transparent),
    radial-gradient(1px 1px at 59px 233px,rgba(255,255,255,.55),transparent),
    radial-gradient(1px 1px at 176px 211px,rgba(180,255,240,.6),transparent),
    radial-gradient(ellipse 70% 45% at 85% 8%,rgba(40,130,140,.2),transparent 70%),
    radial-gradient(ellipse 60% 40% at 5% 95%,rgba(90,60,150,.18),transparent 70%);
  background-size:247px 251px,247px 251px,247px 251px,247px 251px,247px 251px,247px 251px,100% 100vh,100% 100vh;
  background-attachment:scroll,scroll,scroll,scroll,scroll,scroll,fixed,fixed;
}
[data-skin="galaxy"] :is(h1,h2,h3){ font-weight:600; letter-spacing:.02em; }
[data-skin="galaxy"] h2{ text-transform:uppercase; letter-spacing:.09em; font-size:16px; color:color-mix(in srgb,var(--acc) 65%,#fff); }

[data-skin="galaxy"] :is(.panel,.card,.big,.tree-tile,.char,.hero,.step-card,.kvs){
  border-radius:0; border-color:var(--line-2); clip-path:var(--cut);
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 10%,transparent),transparent 54px),color-mix(in srgb,var(--panel) 92%,transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--acc) 55%,transparent);
}
[data-skin="galaxy"] :is(.row,.tile,.habit,.day,.toggle,.hbtn,.focus-bar,.file-pick,.banner){ border-radius:0; }

[data-skin="galaxy"] .bar{ height:5px; border-radius:0; background:#0f2a30; }

[data-skin="galaxy"] .nav{ background:linear-gradient(180deg,rgba(10,30,36,.97),rgba(3,10,14,.98)); border-top:1px solid color-mix(in srgb,var(--acc) 50%,transparent); }

[data-skin="galaxy"] .sheet{ border-radius:0; border-top:1px solid var(--acc); background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 8%,transparent),transparent 80px),var(--panel); }
[data-skin="galaxy"] .toast{ border-radius:0; background:#0b2128; color:var(--text); border:1px solid var(--acc); box-shadow:0 0 18px color-mix(in srgb,var(--acc) 30%,transparent),var(--shadow); }
